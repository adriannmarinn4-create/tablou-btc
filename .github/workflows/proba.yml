name: Proba surse
on:
  push:
    branches: [proba]
permissions:
  contents: read
jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/proba.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
